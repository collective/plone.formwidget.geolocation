[meta]
template = "default"
commit-id = "2.11.1"

[tox]
test_matrix = { "6.2" = ["*"], "6.1" = ["*"] }

[pyproject]
codespell_skip = "*.min.js,*.min.js.map,*.svg,yarn.lock"
dependencies_ignores = "['Products.CMFPlone', 'plone.restapi']"

[gitignore]
extra_lines = """
node_modules/
"""

[github]
jobs = [
    "qa",
    "coverage",
    "release_ready",
    ]
